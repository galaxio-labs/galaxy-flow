
[package]

version = "0.13.15" # @gxl:set(version)
authors = ["wukong<sec-wukong@outlook.com>"]
edition = "2024"
name = "galaxy_flow"
[[bin]]
name = "gx"
path = "app/gx/main.rs"

[workspace]
members = [".", "crates/orion_parse",  "crates/orion_cond"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
winnow = "1.0"
orion-error = { version = "0.8", features = ["serde","anyhow"] }
orion_conf = { version = "0.7", features = ["yaml", "toml", "json", "ini"] }
#orion-error = { path = "../orion-error" }
#orion-error = { git = "https://github.com/galaxio-labs/orion-error.git", tag = "v0.4.0" }
#orion_conf = { git = "https://github.com/galaxio-labs/orion-common.git", tag = "v0.3.0" }
orion-sec=  "0.6"
#orion-ai= { git = "https://github.com/galaxio-labs/orion-ai.git", tag = "v0.2.1" }
#orion-ai= { path = "../orion-ai"  }
#orion-ai= { git = "https://github.com/galaxio-labs/orion-ai.git", branch = "main" }
orion-infra = "0.7"
orion-variate =  "0.13"
orion-accessor = "0.8"
orion_parse = { path = "crates/orion_parse" }
orion_cond = { path = "crates/orion_cond" }
tokio = { version = "1.51", features = ["full"] }
derive_more = { version = "2.0", features = ["full"] }
async-trait = "0.1"

[dependencies]
orion_conf= { workspace = true }
orion-infra = { workspace = true }
orion-variate = { workspace = true }
orion-accessor = { workspace = true }
orion_parse = { workspace = true }
orion-sec = { workspace = true }
#orion-ai = { workspace = true }
uuid = "1.0.0"
derive-getters = "0.5"
derive_builder = "0.20"
derive_setters = "0.1"
getset = "0.1.6"
duct = "1.1.0"
duct_sh = "1.0.0"
fs_extra = "1.3"
home = "0.5"
thiserror = "2.0"
handlebars = "6.3"
lazy_static = "1.5"
chrono = "0.4"
log = "0.4"
git2 = "0.21"
unicase = "2.8"
scopeguard = "1.2"

rand = "0.10"
mockall = "0.15"
once_cell = "1.21"
pretty_env_logger = "0.5"
regex = "1.11"
#rust-ini = "0.21"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
shells = "0.2"
toml = "1.1"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
os_info = "3.12"
winnow = { workspace = true }
colored = "3.0.0"
anyhow = "1.0"
include_dir = "0.7"
walkdir = "2.5"
wildmatch = "2.6"
dirs = "7.0"
indexmap = "2.10"
orion-error = { workspace = true }
tokio = { workspace = true }
derive_more = { workspace = true }
async-trait = { workspace = true }
tokio-util = { version = "0.7", features = ["codec"] }
reqwest = { version = "0.13", features = ["json"] }
time = { version = "0.3.41", features = ["formatting", "local-offset"] }
serde_yaml = "0.9"
contracts = "0.6"
libc = "0.2"
semver = "1.0"
sha2 = "0.11"
flate2 = "1.0"
tar = "0.4"
wp-self-update = "0.3"

[features]
res_depend_test = []
network_test = []


[dev-dependencies]
rstest = "0.27"
tempfile = "3.10"
